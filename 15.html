<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Par ou Ímpar</title>
    <style>
        /* --- CSS IGUAL À IMAGEM --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #5eb5d6; /* Azul do projetor */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        

        .card {
            background-color: white;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .card h1 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }

        .card label {
            display: block;
            text-align: left;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        .card input[type="text"],
        .card input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .botoes {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #1e5b8a;
            color: white;
            border: none;
            padding: 10px 30px; /* Ajustado para ficar mais largo como na imagem */
            border-radius: 5px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100px;
        }

        .btn:hover {
            background-color: #154467;
        }

        .resultado {
            font-size: 14px;
            color: #333;
            margin-top: 15px;
            padding: 10px;
            background-color: #f9f9f9; /* Fundo leve para destacar o resultado */
            border-radius: 4px;
            border: 1px solid #eee;
            min-height: 60px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Jogo do Par ou Ímpar</h1>

        <!-- IDs alterados para bater com o JS: "name" e "number" -->
        <label for="name">Digite seu nome</label>
        <input type="text" id="name" placeholder="Seu nome aqui">

        <label for="number">Digite um número (1-10)</label>
        <input type="number" id="number" placeholder="1-10" min="1" max="10">

        <div class="botoes">
            <button class="btn" id="par">PAR</button>
            <button class="btn" id="impar">ÍMPAR</button>
        </div>

        <!-- Onde o resultado vai aparecer -->
        <div class="resultado" id="result">
            Aguardando sua jogada...
        </div>
    </div>

    <!-- --- SEU JAVASCRIPT INTEGRADO --- -->
    <script>
        const parBtn = document.getElementById('par');
        const imparBtn = document.getElementById('impar');
        const resultDiv = document.getElementById('result');

        function playGame(choice) {
            // Pega os valores dos inputs
            const name = document.getElementById('name').value;
            const playerNum = parseInt(document.getElementById('number').value);

            // Validação básica
            if (!name || isNaN(playerNum)) {
                resultDiv.textContent = 'Por favor, preencha o nome e o número.';
                return;
            }

            // Lógica do jogo
            const compNum = Math.floor(Math.random() * 10) + 1; // Número de 1 a 10
            const compChoice = choice === 'par' ? 'ímpar' : 'par'; // Computador escolhe o oposto
            const sum = playerNum + compNum;
            const isEven = sum % 2 === 0;

            // Define o vencedor
            const winner = (choice === 'par' && isEven) || (choice === 'ímpar' && !isEven) ? name : 'Computador';

            // Exibe o resultado formatado
            resultDiv.innerHTML = `
                <strong>${name}</strong> escolheu <strong>${choice}</strong> (número ${playerNum}).<br>
                Computador escolheu <strong>${compChoice}</strong> (número ${compNum}).<br>
                Soma: <strong>${sum}</strong> (${isEven ? 'Par' : 'Ímpar'}).<br>
                <span style="color:${winner === name ? 'green' : 'red'}; font-weight:bold;">
                    ${winner} venceu!
                </span>
            `;
        }

        // Adiciona os eventos de clique
        parBtn.addEventListener('click', () => playGame('par'));
        imparBtn.addEventListener('click', () => playGame('ímpar')); // Note o acento para manter o texto bonito
    </script>

</body>
</html>
